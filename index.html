<!doctype html>
<html lang="en">
    <head>
        <title>The Costa GUI</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Costa is a small and lightweight GUI (Graphical User Interface) for MS-DOS compatible systems, provided to you free of charge."
        />
        <meta
            name="keywords"
            content="costa, gui, jacob, palm, qbasic, vbdos, visual, basic, walrus, hvalrossen, vb, qb, quickbasic, dos, shell"
        />
        <meta name="author" content="Jacob Palm" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="stylesheet" href="assets/w3.css" />
        <link rel="stylesheet" href="assets/custom.css" />
        <link rel="canonical" href="https://costa.jacobpalm.dk" />
    </head>
    <body id="sitetop">
        <!-- Navbar desktop -->
        <div
            class="w3-bar w3-mobile menubar w3-card w3-large w3-hide-medium w3-hide-small hidden-print"
        >
            <div class="w3-content">
                <a href="/#about" class="w3-bar-item w3-padding-large w3-mobile"
                    >About</a
                >
                <a
                    href="/#downloads"
                    class="w3-bar-item w3-padding-large w3-mobile"
                    >Download</a
                >
                <a
                    href="/?page=blog"
                    class="w3-bar-item w3-padding-large w3-mobile"
                    >Blog</a
                >
                <a
                    href="/?page=archive"
                    class="w3-bar-item w3-padding-large w3-mobile"
                    >Archive</a
                >
                <div class="topnav-right">
                    <a
                        href="/"
                        class="w3-bar-item w3-padding-large w3-mobile sitetitle"
                        >The Costa GUI</a
                    >
                </div>
            </div>
        </div>

        <!-- Navbar mobile -->
        <div
            class="w3-bar-block w3-mobile menubar w3-card w3-large w3-hide-large hidden-print"
        >
            <div class="w3-content">
                <a href="/" class="w3-padding-large sitetitle">The Costa GUI</a>
                <a
                    href="javascript:void(0)"
                    class="w3-padding-large w3-right"
                    style="text-decoration: none"
                    onclick="toggleMenu()"
                    >&#9776;</a
                >
                <div id="mobilemenu" class="w3-hide">
                    <a
                        href="/#about"
                        class="w3-bar-item w3-padding-large w3-mobile"
                        >About</a
                    >
                    <a
                        href="/#downloads"
                        class="w3-bar-item w3-padding-large w3-mobile"
                        >Download</a
                    >
                    <a
                        href="/?page=blog"
                        class="w3-bar-item w3-padding-large w3-mobile"
                        >Blog</a
                    >
                    <a
                        href="/?page=archive"
                        class="w3-bar-item w3-padding-large w3-mobile"
                        >Archive</a
                    >
                </div>
            </div>
        </div>

        <!-- Content -->
        <div
            class="w3-row-padding darkcolor w3-padding-32 w3-container w3-center"
        >
            <div id="contentContainer" class="w3-content">
                <h1>Loading content...</h1>
                <p>
                    If this message doesn't disappear, make sure JavaScript is
                    enabled in your browser.
                </p>
            </div>
        </div>

        <div
            class="w3-row-padding lightcolor w3-padding-32 w3-container w3-hide"
        >
            <div id="subContentContainer" class="w3-content"></div>
        </div>

        <!-- Footer -->
        <footer class="w3-container hidden-print">
            <div class="w3-content w3-center">
                <p class="w3-padding-large">
                    Site &copy; 2004-2026 by
                    <a href="https://jacobpalm.dk">Jacob Palm</a> &#124;
                    Software released under the
                    <a
                        href="https://codeberg.org/jacobpalm/costa/src/branch/master/LICENSE"
                        >MIT License</a
                    >
                </p>
            </div>
        </footer>

        <!-- Dynamic content load, menu code etc. -->
        <script src="/assets/dynamic.js"></script>
    </body>
</html>
