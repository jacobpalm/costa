<!doctype html>
<html lang="en">
    <head>
        <title>Home - The Costa GUI</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Costa is a small and lightweight GUI (Graphical User Interface) for MS-DOS compatible systems, provided to you free of charge."
        />
        <meta
            name="keywords"
            content="costa, gui, jacob, palm, qbasic, vbdos, visual, basic, walrus, hvalrossen, vb, qb, quickbasic, dos, shell"
        />
        <meta name="author" content="Jacob Palm" />

        <base href="https://costa.jacobpalm.dk" />

        <link
            rel="shortcut icon"
            href="https://costa.jacobpalm.dk/favicon.ico"
        />

        <link rel="stylesheet" href="assets/w3.css" />
        <link rel="stylesheet" href="assets/custom.css" />

        <link rel="canonical" href="https://costa.jacobpalm.dk" />
        <link
            rel="alternate"
            type="application/atom+xml"
            title="The Costa GUI"
            href="https://costa.jacobpalm.dk/feed.xml"
        />
    </head>
    <body id="sitetop">
        <!-- Navbar desktop -->
        <div
            class="w3-bar w3-mobile menubar w3-card w3-large w3-hide-medium w3-hide-small hidden-print"
        >
            <div class="w3-content">
                <a
                    href="https://costa.jacobpalm.dk/index.html#about"
                    class="w3-bar-item w3-padding-large w3-mobile"
                    >About</a
                >
                <a
                    href="https://costa.jacobpalm.dk/index.html#downloads"
                    class="w3-bar-item w3-padding-large w3-mobile"
                    >Download</a
                >
                <a
                    href="https://costa.jacobpalm.dk/blog/"
                    class="w3-bar-item w3-padding-large w3-mobile"
                    >Blog</a
                >
                <a
                    href="https://costa.jacobpalm.dk/archive.html"
                    class="w3-bar-item w3-padding-large w3-mobile"
                    >Archive</a
                >
                <div class="topnav-right">
                    <a
                        href="https://costa.jacobpalm.dk"
                        class="w3-bar-item w3-padding-large w3-mobile sitetitle"
                        >The Costa GUI</a
                    >
                </div>
            </div>
        </div>

        <!-- Navbar mobile -->
        <div
            class="w3-bar-block w3-mobile menubar w3-card w3-large w3-hide-large hidden-print"
        >
            <div class="w3-content">
                <a
                    href="https://costa.jacobpalm.dk"
                    class="w3-padding-large sitetitle"
                    >The Costa GUI</a
                >
                <a
                    href="javascript:void(0)"
                    class="w3-padding-large w3-right"
                    style="text-decoration: none"
                    onclick="toggleMenu()"
                    >&#9776;</a
                >
                <div id="mobilemenu" class="w3-hide">
                    <a
                        href="https://costa.jacobpalm.dk/index.html#about"
                        class="w3-bar-item w3-padding-large w3-mobile"
                        >About</a
                    >
                    <a
                        href="https://costa.jacobpalm.dk/index.html#downloads"
                        class="w3-bar-item w3-padding-large w3-mobile"
                        >Download</a
                    >
                    <a
                        href="https://costa.jacobpalm.dk/blog/"
                        class="w3-bar-item w3-padding-large w3-mobile"
                        >Blog</a
                    >
                    <a
                        href="https://costa.jacobpalm.dk/archive.html"
                        class="w3-bar-item w3-padding-large w3-mobile"
                        >Archive</a
                    >
                </div>
            </div>
        </div>

        <!-- Content -->
        <div id="siteContent"></div>

        <!-- Footer -->
        <footer class="w3-container hidden-print">
            <div class="w3-content w3-center">
                <p class="w3-padding-large">
                    Site &copy; 2004-2026 by
                    <a href="https://codeberg.org/jacobpalm">Jacob Palm</a>,
                    software released under the MIT License.
                </p>
            </div>
        </footer>

        <!-- Menu code -->
        <script>
            function toggleMenu() {
                var x = document.getElementById("mobilemenu");
                if (x.className.indexOf("w3-show") == -1) {
                    x.className += " w3-show";
                } else {
                    x.className = x.className.replace(" w3-show", "");
                }
            }
        </script>

        <!-- Dynamic content load -->
        <script>
            const contentContainer = document.getElementById("siteContainer");

            async function fetchContent() {
                let contentFile = await fetch("content.html");
                let content = await contentFile.text();
                contentContainer.innerHTML = content;
            }
        </script>
    </body>
</html>
